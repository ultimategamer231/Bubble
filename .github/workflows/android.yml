name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional. Tag to create and publish as a GitHub pre-release (e.g. phase-0).'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed only to create the tag + pre-release when release_tag is set
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS: supported by Expo SDK 58 / React Native 0.88 ("engines": ^22.13.0).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # JDK 17: required by the React Native 0.88 Gradle plugin (jvmToolchain(17)).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean

      - name: Unit tests, lint and debug build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          name="FocusBubble-${RELEASE_TAG:-${GITHUB_SHA::7}}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### $name — $(stat -c %s "$name") bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish pre-release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Focus Bubble $RELEASE_TAG (debug test build)" \
            --notes "Debug test build for the $RELEASE_TAG phone gate. Not for Google Play. Built from $GITHUB_SHA."
